name: Doc Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run doc lint
        run: |
          python3 scripts/doc_lint.py