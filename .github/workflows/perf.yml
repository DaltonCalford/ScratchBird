name: Performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/perf/**'
      - 'CMakeLists.txt'
      - 'resource/perf_baselines/**'

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential python3
      - name: Configure perf build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCRATCHBIRD_PERF=ON
      - name: Build
        run: cmake --build build -j
      - name: Run perf
        run: |
          python3 tests/perf/run_perf.py --build build --out perf_current.json
      - name: Compare to baseline
        run: |
          python3 tests/perf/run_perf.py --build build --out perf_current.json --baseline resource/perf_baselines/perf_baselines.json
      - name: Upload perf artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf_current
          path: perf_current.json

