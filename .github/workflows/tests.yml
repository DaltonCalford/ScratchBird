name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: Smoke Tests
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Guard V2 Includes
        run: |
          if rg -n "#include\\s+\\\"scratchbird/.*(parser_v2|ast_v2|lexer_v2|semantic_analyzer_v2|bytecode_generator_v2|query_compiler_v2)\\\"" src include; then
            echo "V2 include detected; V3-only policy enforced."
            exit 1
          fi
          if rg -n "parser::v2" src include; then
            echo "parser::v2 usage detected; V3-only policy enforced."
            exit 1
          fi
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libssl-dev libxml2-dev liblz4-dev libgeos-dev libproj-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Run Smoke Tests
        run: bash tests/run_tests.sh smoke

  unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Guard V2 Includes
        run: |
          if rg -n "#include\\s+\\\"scratchbird/.*(parser_v2|ast_v2|lexer_v2|semantic_analyzer_v2|bytecode_generator_v2|query_compiler_v2)\\\"" src include; then
            echo "V2 include detected; V3-only policy enforced."
            exit 1
          fi
          if rg -n "parser::v2" src include; then
            echo "parser::v2 usage detected; V3-only policy enforced."
            exit 1
          fi
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libssl-dev libxml2-dev liblz4-dev libgeos-dev libproj-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Run Unit Tests
        run: bash tests/run_tests.sh unit

  integration:
    runs-on: ubuntu-latest
    name: Integration Tests
    env:
      SCRATCHBIRD_TEST_NETWORK: 1
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Guard V2 Includes
        run: |
          if rg -n "#include\\s+\\\"scratchbird/.*(parser_v2|ast_v2|lexer_v2|semantic_analyzer_v2|bytecode_generator_v2|query_compiler_v2)\\\"" src include; then
            echo "V2 include detected; V3-only policy enforced."
            exit 1
          fi
          if rg -n "parser::v2" src include; then
            echo "parser::v2 usage detected; V3-only policy enforced."
            exit 1
          fi
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libssl-dev libxml2-dev liblz4-dev libgeos-dev libproj-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Run Integration Tests
        run: bash tests/run_tests.sh integration
