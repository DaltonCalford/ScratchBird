plugins {
    id 'java-library'
}

group = 'com.scratchbird'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
}

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'ScratchBird JDBC Driver',
            'Implementation-Version': version,
            'Automatic-Module-Name': 'com.scratchbird.jdbc'
        )
    }
}
