        exec: cases/optimizer/sql/mysql/merge_join_presorted.exec.sql
        teardown: cases/optimizer/sql/mysql/merge_join_presorted.teardown.sql
      firebird:
        setup: cases/optimizer/sql/firebird/merge_join_presorted.setup.sql
        plan: cases/optimizer/sql/firebird/merge_join_presorted.plan.sql
        exec: cases/optimizer/sql/firebird/merge_join_presorted.exec.sql
        teardown: cases/optimizer/sql/firebird/merge_join_presorted.teardown.sql

  - id: expression_lookup
    enabled: true
    tags: [expression_stats, lookup]
    lanes: [native, postgresql, duckdb, mysql, firebird]
    expectation: must_match
    scratchbird_lane: native
    intent: Expression-index-backed equality lookup on LOWER(name) with deterministic ordered output.
    native_equivalence_note: ScratchBird native uses v3 syntax that preserves the same expression-lookup intent as the donor dialect statements.
    normalization:
