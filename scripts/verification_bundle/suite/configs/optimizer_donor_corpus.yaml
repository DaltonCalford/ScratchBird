        plan: cases/optimizer/sql/postgresql/ordered_limit_topk.plan.sql
        exec: cases/optimizer/sql/postgresql/ordered_limit_topk.exec.sql
        teardown: cases/optimizer/sql/postgresql/ordered_limit_topk.teardown.sql
      duckdb:
        setup: cases/optimizer/sql/duckdb/ordered_limit_topk.setup.sql
        plan: cases/optimizer/sql/duckdb/ordered_limit_topk.plan.sql
        exec: cases/optimizer/sql/duckdb/ordered_limit_topk.exec.sql
        teardown: cases/optimizer/sql/duckdb/ordered_limit_topk.teardown.sql
      mysql:
        setup: cases/optimizer/sql/mysql/ordered_limit_topk.setup.sql
        plan: cases/optimizer/sql/mysql/ordered_limit_topk.plan.sql
        exec: cases/optimizer/sql/mysql/ordered_limit_topk.exec.sql
        teardown: cases/optimizer/sql/mysql/ordered_limit_topk.teardown.sql
      firebird:
        setup: cases/optimizer/sql/firebird/ordered_limit_topk.setup.sql
        plan: cases/optimizer/sql/firebird/ordered_limit_topk.plan.sql
        exec: cases/optimizer/sql/firebird/ordered_limit_topk.exec.sql
        teardown: cases/optimizer/sql/firebird/ordered_limit_topk.teardown.sql

  - id: merge_join_presorted
    enabled: true
    tags: [join, merge, ordering]
    lanes: [native, postgresql, duckdb, mysql, firebird]
    expectation: must_match
    scratchbird_lane: native
    intent: Equality join over indexed join keys with ordered output intended to exercise merge-capable planning.
    native_equivalence_note: ScratchBird native uses v3 join syntax with the same equality-join and ordered-output intent as the donor dialect statements.
    normalization:
      order_sensitive: false
      require_plan_lines: true
    scoring:
