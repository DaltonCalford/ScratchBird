# ScratchBird default configuration

# Bind address for the server listener
BIND_ADDRESS=0.0.0.0

# Port number
PORT=5439

# Log level: trace, debug, info, warn, error
LOG_LEVEL=info

# Data directory
DATA_DIR=/var/lib/scratchbird/data

# TLS settings (if applicable)
#TLS_ENABLED=false
#TLS_CERT_FILE=/etc/scratchbird/server.crt
#TLS_KEY_FILE=/etc/scratchbird/server.key

