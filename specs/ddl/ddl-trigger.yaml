content:
  create:
    grammar: |
      CREATE TRIGGER trg_name {BEFORE|AFTER} {INSERT|UPDATE|DELETE}
      ON tbl
      [ACTIVE|INACTIVE]
      POSITION n
      AS
      BEGIN
        -- PSQL body
      END
  drop:
    grammar: 'DROP TRIGGER trg_name'
  acceptance:
    - 'CREATE TRIGGER trg BEFORE INSERT ON t POSITION 0 AS BEGIN END'
