id: ddl-procedure
title: CREATE/ALTER/DROP PROCEDURE
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [psql-overview]
content:
  create:
    grammar: |
      CREATE PROCEDURE name(args)
      RETURNS (out_args)
      AS
      BEGIN
        -- PSQL body
      END
  drop:
    grammar: 'DROP PROCEDURE name(args)'
  acceptance:
    - 'CREATE PROCEDURE p() RETURNS () AS BEGIN END'
