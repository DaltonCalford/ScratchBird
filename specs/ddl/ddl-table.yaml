id: ddl-table
title: CREATE/ALTER/DROP TABLE
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [types-core, domains]
content:
  create:
    grammar: 'CREATE TABLE name ( col_name type [DEFAULT expr] [NOT NULL] [CONSTRAINT name] [PRIMARY KEY|UNIQUE|CHECK(...)] [, ...] )'
  alter:
    grammar: 'ALTER TABLE name ADD COLUMN ... | DROP COLUMN ... | ADD CONSTRAINT ... | DROP CONSTRAINT ...'
  drop:
    grammar: 'DROP TABLE name [CASCADE|RESTRICT]'
  acceptance:
    - 'CREATE TABLE t(id INTEGER PRIMARY KEY, name VARCHAR(50) NOT NULL)'
    - 'ALTER TABLE t ADD COLUMN created TIMESTAMP'
    - 'DROP TABLE t'
