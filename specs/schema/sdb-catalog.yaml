id: sdb-catalog
name: ScratchBird System Catalog (SDB$*)
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  principles:
    - UUID primary keys for all objects (`oid`), stable across rename/move
    - Recursive schemas with parent pointers; names unique per parent
    - Normalized separation of objects, names, definitions, and dependencies
    - Back-compat via views that emulate `RDB$*` (and `MON$*`) where feasible
    - Store source text and doc comments separately from normalized metadata
  domains_ref: sdb-domains
  tables:
    - table: SDB$OBJECT
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, comment: Object identifier}
        - {name: type, domain: SDB$OBJECT_TYPE, comment: Object type}
        - {name: schema_oid, domain: SDB$OID, ref: SDB$SCHEMA.oid, null: true, comment: Owning schema}
        - {name: name, domain: SDB$NAME, comment: Local name}
        - {name: owner_oid, domain: SDB$OID, ref: SDB$USER.oid, comment: Owner}
        - {name: created_at, domain: SDB$TIMESTAMPTZ, comment: Creation timestamp}
        - {name: altered_at, domain: SDB$TIMESTAMPTZ, comment: Last modification timestamp}
        - {name: flags, domain: SDB$BIGINT, default: 0, comment: Internal flags}
        - {name: comment, domain: SDB$TEXT, null: true, comment: Documentation comment}
        - {name: source_hash, base: CHAR(40), null: true, comment: Source text hash}
      unique:
        - [schema_oid, type, name]
    - table: SDB$SCHEMA
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID}
        - {name: parent_oid, domain: SDB$OID, ref: SDB$SCHEMA.oid, null: true, comment: Parent schema}
        - {name: name, domain: SDB$NAME}
        - {name: kind, domain: SDB$SCHEMA_KIND}
        - {name: path_cache, domain: SDB$TEXT, null: true}
      unique:
        - [parent_oid, name]
    - table: SDB$RELATION
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: kind, domain: SDB$RELATION_KIND}
        - {name: persistence, domain: SDB$PERSISTENCE, default: PERMANENT}
        - {name: external_file, domain: SDB$TEXT, null: true}
        - {name: tablespace, domain: SDB$NAME, null: true}
        - {name: with_oids, domain: SDB$BOOL, default: false}
    - table: SDB$DOMAIN
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: base_type, base: VARCHAR(64)}
        - {name: length, domain: SDB$INT, null: true}
        - {name: precision, domain: SDB$INT, null: true}
        - {name: scale, domain: SDB$INT, null: true}
        - {name: charset, base: VARCHAR(64), null: true}
        - {name: collate, base: VARCHAR(64), null: true}
        - {name: not_null, domain: SDB$BOOL, default: false}
        - {name: default_expr, domain: SDB$TEXT, null: true}
        - {name: check_expr, domain: SDB$TEXT, null: true}
    - table: SDB$COLUMN
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID}
        - {name: relation_oid, domain: SDB$OID, ref: SDB$RELATION.oid}
        - {name: position, domain: SDB$INT}
        - {name: name, domain: SDB$NAME}
        - {name: domain_oid, domain: SDB$OID, ref: SDB$DOMAIN.oid, null: true}
        - {name: inline_type, domain: SDB$JSON, null: true}
        - {name: default_expr, domain: SDB$TEXT, null: true}
        - {name: identity_kind, base: VARCHAR(16), check: "VALUE IN ('NONE','BY_DEFAULT','ALWAYS')", default: NONE}
        - {name: identity_options, domain: SDB$JSON, null: true}
        - {name: computed_expr, domain: SDB$TEXT, null: true}
        - {name: col_charset, base: VARCHAR(64), null: true}
        - {name: col_collate, base: VARCHAR(64), null: true}
        - {name: not_null, domain: SDB$BOOL, default: false}
      unique:
        - [relation_oid, name]
    - table: SDB$CONSTRAINT
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: relation_oid, domain: SDB$OID, ref: SDB$RELATION.oid}
        - {name: type, domain: SDB$CONSTRAINT_TYPE}
        - {name: deferrable, domain: SDB$BOOL, default: false}
        - {name: initially_deferred, domain: SDB$BOOL, default: false}
        - {name: check_expr, domain: SDB$TEXT, null: true}
        - {name: index_oid, domain: SDB$OID, ref: SDB$INDEX.oid, null: true}
        - {name: ref_relation_oid, domain: SDB$OID, ref: SDB$RELATION.oid, null: true}
        - {name: on_delete, domain: SDB$ACTION, default: NO_ACTION}
        - {name: on_update, domain: SDB$ACTION, default: NO_ACTION}
    - table: SDB$CONSTRAINT_KEY
      pk: [constraint_oid, position]
      cols:
        - {name: constraint_oid, domain: SDB$OID, ref: SDB$CONSTRAINT.oid}
        - {name: position, domain: SDB$INT}
        - {name: column_oid, domain: SDB$OID, ref: SDB$COLUMN.oid}
        - {name: ref_column_oid, domain: SDB$OID, ref: SDB$COLUMN.oid, null: true}
    - table: SDB$INDEX
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: relation_oid, domain: SDB$OID, ref: SDB$RELATION.oid}
        - {name: unique, domain: SDB$BOOL, default: false}
        - {name: method, domain: SDB$INDEX_METHOD}
        - {name: where_expr, domain: SDB$TEXT, null: true}
        - {name: include_cols, domain: SDB$JSON, null: true}
        - {name: tablespace, domain: SDB$NAME, null: true}
    - table: SDB$INDEX_KEY
      pk: [index_oid, position]
      cols:
        - {name: index_oid, domain: SDB$OID, ref: SDB$INDEX.oid}
        - {name: position, domain: SDB$INT}
        - {name: column_oid, domain: SDB$OID, ref: SDB$COLUMN.oid, null: true}
        - {name: expr, domain: SDB$TEXT, null: true}
        - {name: direction, domain: SDB$DIR, default: ASC}
        - {name: collation, base: VARCHAR(64), null: true}
    - table: SDB$ROUTINE
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: kind, base: VARCHAR(16), check: "VALUE IN ('PROCEDURE','FUNCTION')"}
        - {name: language, base: VARCHAR(16), check: "VALUE IN ('PSQL','C','JAVA','SQL')"}
        - {name: security, domain: SDB$SECURITY_KIND, default: INVOKER}
        - {name: volatility, domain: SDB$VOLATILITY, default: VOLATILE}
        - {name: leakproof, domain: SDB$BOOL, default: false}
        - {name: returns_set, domain: SDB$BOOL, default: false}
    - table: SDB$ROUTINE_PARAM
      pk: [routine_oid, position]
      cols:
        - {name: routine_oid, domain: SDB$OID, ref: SDB$ROUTINE.oid}
        - {name: position, domain: SDB$INT}
        - {name: name, domain: SDB$NAME}
        - {name: mode, base: VARCHAR(8), check: "VALUE IN ('IN','OUT','INOUT')", default: IN}
        - {name: domain_oid, domain: SDB$OID, ref: SDB$DOMAIN.oid, null: true}
        - {name: inline_type, domain: SDB$JSON, null: true}
    - table: SDB$PACKAGE
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
    - table: SDB$PACKAGE_MEMBER
      pk: [package_oid, member_name]
      cols:
        - {name: package_oid, domain: SDB$OID, ref: SDB$PACKAGE.oid}
        - {name: member_name, domain: SDB$NAME}
        - {name: routine_oid, domain: SDB$OID, ref: SDB$ROUTINE.oid}
    - table: SDB$SEQUENCE
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: start_value, domain: SDB$DEC38}
        - {name: increment_by, domain: SDB$DEC38}
        - {name: min_value, domain: SDB$DEC38, null: true}
        - {name: max_value, domain: SDB$DEC38, null: true}
        - {name: cycle, domain: SDB$BOOL, default: false}
        - {name: cache, domain: SDB$INT, default: 1}
    - table: SDB$TRIGGER
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: relation_oid, domain: SDB$OID, ref: SDB$RELATION.oid}
        - {name: timing, base: VARCHAR(8), check: "VALUE IN ('BEFORE','AFTER')"}
        - {name: events, domain: SDB$JSON} # INSERT/UPDATE/DELETE, optional UPDATE OF cols
        - {name: position, domain: SDB$INT, default: 0}
    - table: SDB$EXCEPTION
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: message, domain: SDB$TEXT}
    - table: SDB$CHARSET
      pk: [name]
      cols:
        - {name: name, domain: SDB$NAME}
        - {name: description, domain: SDB$TEXT, null: true}
    - table: SDB$COLLATION
      pk: [name]
      cols:
        - {name: name, domain: SDB$NAME}
        - {name: base_charset, base: VARCHAR(64)}
        - {name: deterministic, domain: SDB$BOOL, default: true}
    - table: SDB$USER
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID}
        - {name: name, domain: SDB$NAME}
        - {name: attrs, domain: SDB$JSON, null: true}
      unique:
        - [name]
    - table: SDB$ROLE
      pk: [oid]
      cols:
        - {name: oid, domain: SDB$OID}
        - {name: name, domain: SDB$NAME}
      unique:
        - [name]
    - table: SDB$GRANT
      pk: [grantee_oid, object_oid, privilege, columns]
      cols:
        - {name: grantee_oid, domain: SDB$OID} # user or role
        - {name: object_oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: privilege, base: VARCHAR(32)}
        - {name: grantor_oid, domain: SDB$OID}
        - {name: grant_option, domain: SDB$BOOL, default: false}
        - {name: columns, domain: SDB$JSON, null: true}
    - table: SDB$DEPENDENCY
      pk: [from_oid, to_oid, kind]
      cols:
        - {name: from_oid, domain: SDB$OID}
        - {name: to_oid, domain: SDB$OID}
        - {name: kind, base: VARCHAR(16), check: "VALUE IN ('NAME','TYPE','COLUMN','INDEX','ROUTINE','PRIVILEGE')"}
        - {name: detail_from, domain: SDB$JSON, null: true}
        - {name: detail_to, domain: SDB$JSON, null: true}
    - table: SDB$SOURCE
      pk: [object_oid]
      cols:
        - {name: object_oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: text, domain: SDB$TEXT}
        - {name: doc, domain: SDB$TEXT, null: true}
    - table: SDB$STATS
      pk: [object_oid]
      cols:
        - {name: object_oid, domain: SDB$OID, ref: SDB$OBJECT.oid}
        - {name: stats, domain: SDB$JSON}
  notes:
    - Inline type JSON mirrors `TypeDescriptor` (name, length, precision, scale, charset, collate, array_rank)
    - Views will expose Firebird-compatible `RDB$` structures; see `sdb-compat-views` spec
