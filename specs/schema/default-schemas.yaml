id: default-schemas
title: Default Namespace Layout (Top-level Schemas)
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [schema-search-path, schema-navigation, system-schema, ddl-dblink]
content:
  goals: |
    Provide a clear, compatible namespace layout that separates catalog, monitoring, information
    views, security metadata, and user-visible objects; support user/role home schemas and remote
    links; minimize namespace pollution.
  top_level:
    - name: sys
      aka: [system]
      purpose: Root for all internal/system namespaces (catalog, monitoring, security, admin, etc.)
      children:
        - name: catalog
          purpose: Firebird-compatible catalog tables (RDB$*) and views
        - name: monitoring
          purpose: Monitoring views (MON$*)
        - name: information
          purpose: Canonical information-schema views
        - name: security
          purpose: Users, roles, mappings, privileges metadata
        - name: admin
          purpose: Maintenance/configuration metadata (backup, sweep, etc.)
        - name: replication
          purpose: Publications/subscriptions and replication state (optional)
        - name: extensions
          purpose: UDR/UDR engines and plugin metadata
        - name: temp
          purpose: Session-scoped temporary namespace root (virtual)
    - name: information_schema
      purpose: SQL-standard INFORMATION_SCHEMA views; mirrors sys.information for compatibility
      notes: Exposed primarily for tooling compatibility; canonical home is sys.information
    - name: public
      purpose: Default user-visible schema for shared objects
    - name: remote
      purpose: Container for DDL-defined database links (see ddl-dblink); children are link names
      notes: Objects under a link appear as nested schemas (link/schema/object)
    - name: users
      purpose: Optional virtual container; each child maps to the user's home schema
      notes: By default, a user's home schema is a top-level schema named after the user. The
        users/<name> path is a convenience alias.
    - name: roles
      purpose: Optional virtual container mapping roles to associated home schemas
      notes: Disabled by default; organizations may enable to dedicate schemas per role.
  naming:
    case: lower
    reserved: [sys, information_schema, public, remote, users, roles]
  search_path_default: [user_home, public, sys.information]
  acceptance:
    - 'SELECT * FROM sys.catalog.RDB$RELATIONS'
    - 'SELECT * FROM sys.monitoring.MON$ATTACHMENTS'
    - 'SELECT * FROM INFORMATION_SCHEMA.TABLES'
    - 'SELECT * FROM public.t'
    - 'SELECT * FROM remote.salesdb.public.customers'
    - 'SELECT * FROM users.alice.orders'
