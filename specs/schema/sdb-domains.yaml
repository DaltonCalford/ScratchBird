id: sdb-domains
name: System Domains for SDB$ Catalog
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    All SDB$ catalog columns use standardized DOMAINS to ensure consistency,
    constraints, and documentation. These domains also simplify future
    refactoring and compatibility views.
  domains:
    - name: SDB$OID
      base: UUID
      not_null: true
      comment: Globally unique object identifier (stable across rename/move)
    - name: SDB$NAME
      base: VARCHAR(128)
      not_null: true
      comment: Unquoted identifier name with engine-defined case folding
    - name: SDB$QNAME
      base: VARCHAR(256)
      not_null: true
      comment: Fully-qualified name (e.g., schema.local_name) for display
    - name: SDB$SCHEMA_KIND
      base: VARCHAR(16)
      check: "VALUE IN ('SYSTEM','USER','REMOTE')"
      comment: Kind of schema
    - name: SDB$OBJECT_TYPE
      base: VARCHAR(24)
      check: "VALUE IN ('ROLE','USER','SCHEMA','TABLE','VIEW','MATVIEW','GTT','FOREIGN_TABLE','INDEX','SEQUENCE','DOMAIN','CONSTRAINT','TRIGGER','PROCEDURE','FUNCTION','PACKAGE','EXCEPTION','COLLATION','CHARSET','PRIVILEGE','TABLESPACE','RLS_POLICY','MATERIALIZED_VIEW')"
      comment: Logical type of the catalog object
    - name: SDB$RELATION_KIND
      base: VARCHAR(16)
      check: "VALUE IN ('TABLE','VIEW','MATVIEW','GTT','FOREIGN_TABLE')"
      comment: Kind of relation
    - name: SDB$PERSISTENCE
      base: VARCHAR(16)
      check: "VALUE IN ('PERMANENT','GLOBAL_TEMPORARY')"
      comment: Relation persistence
    - name: SDB$TIMESTAMPTZ
      base: TIMESTAMP WITH TIME ZONE
      comment: Timestamp including time zone
    - name: SDB$BOOL
      base: BOOLEAN
      comment: Boolean flag
    - name: SDB$TEXT
      base: TEXT
      comment: Free-form text (UTF8)
    - name: SDB$JSON
      base: JSON
      comment: JSON-typed attribute bag
    - name: SDB$INDEX_METHOD
      base: VARCHAR(16)
      check: "VALUE IN ('BTREE','HASH','GIN','RTREE','BITMAP','PARTIAL_HASH')"
      comment: Index access method
    - name: SDB$DIR
      base: VARCHAR(128)
      comment: Direction or ordering
    - name: SDB$INT
      base: INTEGER
      comment: Generic integer
    - name: SDB$BIGINT
      base: BIGINT
      comment: Generic 64-bit integer
    - name: SDB$DEC38
      base: NUMERIC(38)
      comment: High precision numeric
    - name: SDB$VOLATILITY
      base: VARCHAR(16)
      check: "VALUE IN ('IMMUTABLE','STABLE','VOLATILE')"
      comment: Routine volatility
    - name: SDB$SECURITY_KIND
      base: VARCHAR(16)
      check: "VALUE IN ('DEFINER','INVOKER')"
      comment: Routine security mode
    - name: SDB$CONSTRAINT_TYPE
      base: VARCHAR(8)
      check: "VALUE IN ('PK','FK','UNIQUE','CHECK')"
      comment: Constraint type
    - name: SDB$ACTION
      base: VARCHAR(12)
      check: "VALUE IN ('NO_ACTION','RESTRICT','CASCADE','SET_NULL','SET_DEFAULT')"
      comment: FK action
