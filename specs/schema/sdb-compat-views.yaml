id: sdb-compat-views
name: Compatibility Views (RDB$*, MON$*) over SDB$*
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    To maintain compatibility with legacy tools, ScratchBird provides read-only
    views that emulate Firebird's `RDB$*` and `MON$*` structures using the new
    normalized SDB$ catalog. Deprecated/unused columns are exposed with NULLs or
    synthesized values. Primary keys remain as in Firebird for stability where
    possible; internal joins use UUIDs.
  examples:
    - name: RDB$RELATIONS
      text: |
        CREATE VIEW RDB$RELATIONS AS
        SELECT
          o.name AS RDB$RELATION_NAME,
          CAST(NULL AS SMALLINT) AS RDB$SYSTEM_FLAG,
          CAST(NULL AS SMALLINT) AS RDB$DBKEY_LENGTH,
          CAST(CASE WHEN r.kind IN ('VIEW','MATVIEW') THEN 1 ELSE 0 END AS SMALLINT) AS RDB$VIEW_BLR,
          CAST(NULL AS BLOB) AS RDB$VIEW_SOURCE,
          CAST(NULL AS SMALLINT) AS RDB$RELATION_TYPE,
          CAST(NULL AS SMALLINT) AS RDB$RELATION_ID,
          CAST(NULL AS SMALLINT) AS RDB$FORMAT,
          CAST(NULL AS SMALLINT) AS RDB$FIELD_ID,
          s.name AS RDB$OWNER_NAME
        FROM SDB$OBJECT o
        JOIN SDB$RELATION r ON r.oid = o.oid
        LEFT JOIN SDB$SCHEMA sc ON sc.oid = o.schema_oid
        LEFT JOIN SDB$USER s ON s.oid = o.owner_oid;
    - name: RDB$FIELDS
      text: |
        CREATE VIEW RDB$FIELDS AS
        SELECT
          d.oid AS RDB$FIELD_ID,
          d.base_type AS RDB$FIELD_TYPE,
          d.length AS RDB$FIELD_LENGTH,
          d.precision AS RDB$FIELD_PRECISION,
          d.scale AS RDB$FIELD_SCALE,
          d.charset AS RDB$CHARACTER_SET_ID,
          d.collate AS RDB$COLLATION_ID
        FROM SDB$DOMAIN d;
    - name: MON$ATTACHMENTS
      text: |
        CREATE VIEW MON$ATTACHMENTS AS
        SELECT
          a.attachment_id AS MON$ATTACHMENT_ID,
          a.user_name AS MON$USER,
          a.remote_address AS MON$REMOTE_ADDRESS,
          a.remote_process AS MON$REMOTE_PROCESS
        FROM SYS.MON$ATTACHMENT a; -- SDB monitoring schema provides sources
  notes:
    - Exact column sets will track Firebird 5.0 reference; non-applicable columns return NULL.
    - Updatable semantics are not provided; writes go through SDB$ tables and DDL/DCL.
