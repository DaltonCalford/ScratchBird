id: sql-ddl-collation
title: COLLATION
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE COLLATION name FOR charset [FROM EXTERNAL 'spec'] [BASED ON base] [PAD SPACE]
    ALTER COLLATION name ...
    DROP COLLATION name
  acceptance:
    - "CREATE COLLATION c FOR UTF8 FROM EXTERNAL 'ucase'"
    - 'CREATE COLLATION c2 FOR UTF8 BASED ON unicode PAD SPACE'
