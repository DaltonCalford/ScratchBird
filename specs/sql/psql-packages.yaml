content:
  grammar: |
    CREATE PACKAGE name AS <decls> [END]
    CREATE PACKAGE BODY name AS <psql> END
    DROP PACKAGE name | DROP PACKAGE BODY name
  acceptance:
    - 'CREATE PACKAGE pkg AS PROCEDURE p; END'
    - 'CREATE PACKAGE BODY pkg AS BEGIN END'
