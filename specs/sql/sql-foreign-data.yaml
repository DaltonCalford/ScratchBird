id: sql-foreign-data
title: Foreign servers, user mappings, and foreign tables
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  grammar: |
    CREATE FOREIGN SERVER name TYPE {ODBC|MSSQL|POSTGRES|...}
      OPTIONS (key=value [, ...])
    DROP FOREIGN SERVER name

    CREATE USER MAPPING FOR {USER u|ROLE r|PUBLIC}
      SERVER server_name OPTIONS (remote_user='...', password='...', secret='...')
    DROP USER MAPPING FOR {USER u|ROLE r|PUBLIC} SERVER server_name

    CREATE FOREIGN TABLE schema.name (
      col type [, ...]
    ) SERVER server_name OPTIONS (remote_table='schema.table', updatable='true')
    DROP FOREIGN TABLE schema.name

    IMPORT FOREIGN SCHEMA remote_schema FROM SERVER server_name
      INTO local_schema OPTIONS (include='t1,t2', case='preserve')

  acceptance:
    - "CREATE FOREIGN SERVER srv_odbc TYPE ODBC OPTIONS (dsn='MyDSN')"
    - "CREATE USER MAPPING FOR USER alice SERVER srv_odbc OPTIONS (remote_user='alice', password='secret')"
    - "CREATE FOREIGN TABLE ext.customers (id INT, name VARCHAR(100)) SERVER srv_odbc OPTIONS (remote_table='dbo.Customers')"
    - "IMPORT FOREIGN SCHEMA dbo FROM SERVER srv_odbc INTO ext OPTIONS (include='Customers,Orders')"

  privileges:
    - "GRANT USAGE ON FOREIGN SERVER srv_odbc TO role_r"
    - "GRANT SELECT ON FOREIGN TABLE ext.customers TO user_x"

  diagnostics:
    - "Unknown provider TYPE '<t>'"
    - "USER MAPPING requires credentials or secret reference"
    - "IMPORT FOREIGN SCHEMA remote schema not found"
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, no trailing punctuation
