id: sql-terminators
title: Smart statement termination (semicolonless mode)
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Optional mode that lets users omit ";" at top level.
    A statement ends when the parse succeeds at depth==0, or the next token is a
    top-level starter. Semicolon, if present, always wins as an explicit barrier.
    PSQL bodies continue to require semicolons.

  modes:
    - off        # default for scripts (firebird-compatible)
    - on         # enabled for interactive CLI and optionally scripts
  session:
    - "SET PARSER SMART TERMINATOR {ON|OFF}"
  cli:
    - "--smart-terminator[=on|off]"

  rules:
    - "Maintain structural depth counters: parentheses, brackets, BEGIN..END; track string/comment states."
    - "A boundary is recognized when: parse ok AND depth==0."
    - "Alternatively, when depth==0 and next token is a top-level starter, the previous statement is considered complete."
    - "Top-level starters (case-insensitive): CREATE, ALTER, DROP, RECREATE, GRANT, REVOKE, SET, COMMIT, ROLLBACK, SAVEPOINT, RELEASE, CONNECT, DISCONNECT, EXECUTE BLOCK, COMMENT, CREATE OR ALTER, MERGE, INSERT, UPDATE, DELETE, SELECT, WITH."
    - "Semicolons remain supported everywhere; if present, they terminate the current statement immediately."
    - "Inside PSQL bodies (EXECUTE BLOCK, CREATE PROCEDURE/FUNCTION/TRIGGER body): semicolons remain required to separate inner statements."

  acceptance:
    - |
      -- smart mode ON
      CREATE TABLE t(id INT)
      CREATE INDEX ix_t_id ON t(id)
      SELECT 1
    - |
      -- WITH CTE and compound tail without ;
      WITH c AS (SELECT 1 a) SELECT * FROM c UNION SELECT 2
      CREATE VIEW v AS SELECT * FROM c  -- boundary by next starter
    - |
      -- PSQL body still needs semicolons inside
      CREATE OR ALTER PROCEDURE p AS
      BEGIN
        INSERT INTO t(id) VALUES(1);
        INSERT INTO t(id) VALUES(2);
      END

  diagnostics:
    - "statement incomplete; waiting for more input (expected <token/category>)"
    - "PSQL body statements require semicolons (smart terminator is top-level only)"
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, stable wording

  notes:
    - "Applies in the statement feeder; no change to core grammar."
    - "Error recovery must not prematurely split: require ok && depth==0."
    - "No wire/protocol impact; CLI and embedded API gain a feeder helper."
