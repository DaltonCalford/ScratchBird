id: sql-ddl-domain
title: CREATE/ALTER/DROP DOMAIN
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE DOMAIN name AS type [DEFAULT expr] [CHECK (expr)] [COLLATE x]
    ALTER DOMAIN name <set default|drop default|add constraint|drop constraint|type change|collation>
    DROP DOMAIN name
  acceptance:
    - "CREATE DOMAIN d AS VARCHAR(10) DEFAULT 'x' CHECK (value <> '') COLLATE UTF8"
    - 'ALTER DOMAIN d DROP DEFAULT'
    - 'DROP DOMAIN d'
