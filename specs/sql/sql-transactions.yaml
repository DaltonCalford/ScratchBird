id: sql-transactions
title: Transaction Control
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: []
content:
  statements:
    - 'BEGIN [WORK|TRANSACTION]'
    - 'COMMIT [WORK] [RETAIN]'
    - 'ROLLBACK [WORK]'
    - 'SAVEPOINT name'
    - 'RELEASE SAVEPOINT name'
    - 'SET TRANSACTION <isolation|access|wait|table reservations|...>'
  acceptance:
    - 'BEGIN; SAVEPOINT s1; ROLLBACK;'
    - 'SET TRANSACTION READ COMMITTED READ WRITE WAIT RECORD_VERSION'
    - 'SET TRANSACTION SNAPSHOT TABLE STABILITY NO WAIT'
    - 'SET TRANSACTION RESERVING T1, T2 FOR SHARED READ'
notes:
  isolation: 'READ COMMITTED | SNAPSHOT | SNAPSHOT TABLE STABILITY'
  reservations: 'RESERVING t1[, t2 ...] FOR [SHARED READ|PROTECTED WRITE]'
