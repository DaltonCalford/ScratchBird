id: sql-cte
title: Common Table Expressions (WITH)
status: draft
version: 0.2.0
updated: 2025-08-12T00:00:00Z
related: [sql-select]
content:
  grammar: |
    WITH [RECURSIVE] cte_name [(col_list)] AS (subquery) [, ...]
    SELECT ...
  validation: |
    If a column list is specified, its count should match the SELECT projection count of the CTE body.
    Current implementation emits a warning stub when they differ.
  acceptance:
    - 'WITH c AS (SELECT 1 AS x) SELECT x FROM c'
    - 'WITH RECURSIVE r(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM r WHERE n < 10) SELECT * FROM r'
    - 'WITH r(a,b) AS (SELECT 1) SELECT 1'  # mismatch -> warning stub
