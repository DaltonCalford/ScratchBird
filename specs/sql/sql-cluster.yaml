id: sql-cluster
title: Cluster configuration and shared authentication
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Parser-only SQL for defining a cluster of engines, nodes, services, and
    shared authentication providers. Execution/coordination deferred.

  grammar: |
    CREATE CLUSTER name [OPTIONS (key=value [, ...])]
    ALTER CLUSTER name ADD NODE 'node' OPTIONS (host='ip', port=3050)
    ALTER CLUSTER name REMOVE NODE 'node'
    ALTER CLUSTER name SET AUTH PROVIDER prov_name
    DROP CLUSTER name

    CREATE AUTH PROVIDER name TYPE {OIDC|KERBEROS|LDAP} OPTIONS (key=value [, ...])
    DROP AUTH PROVIDER name

    ALTER DATABASE SET CLUSTER name [ROLE {primary|replica|shard}] OPTIONS (key=value [, ...])
    ALTER DATABASE UNSET CLUSTER

    CREATE SERVICE svc ON CLUSTER name FOR DATABASE db
      OPTIONS (read_write=on, min_replicas=2)
    ALTER SERVICE svc SET (key=value [, ...])
    DROP SERVICE svc

  acceptance:
    - "CREATE CLUSTER c1"
    - "ALTER CLUSTER c1 ADD NODE 'n1' OPTIONS (host='10.0.0.1', port=3050)"
    - "CREATE AUTH PROVIDER oidc TYPE OIDC OPTIONS (issuer='https://issuer', client_id='id')"
    - "ALTER DATABASE SET CLUSTER c1 ROLE replica"
    - "CREATE SERVICE rw ON CLUSTER c1 FOR DATABASE db OPTIONS (read_write=on)"

  diagnostics:
    - "Unknown auth provider type '<t>'"
    - "Node already exists"

  notes:
    - Parser-only. Future: membership/consensus, routing, health checks.
    - Auth providers configure identity-plane; roles/privileges remain database-scoped unless opted into cluster sync.

  future_engine_tasks:
    - Implement control-plane for cluster membership and service routing.
    - Shared authentication validation against configured provider.
    - Integration with replication and failover orchestration.
