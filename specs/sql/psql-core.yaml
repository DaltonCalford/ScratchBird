id: psql-core
name: PSQL Core
notes:
  - Supports EXECUTE BLOCK, DECLARE vars/cursors, FOR SELECT INTO, IF/WHILE/LEAVE/CONTINUE, CASE, EXCEPTION/WHEN..DO, RETURN/SUSPEND/EXIT, OPEN/FETCH/CLOSE, EXECUTE PROCEDURE, EXECUTE STATEMENT, CALL, RAISE, POST EVENT
accept:
  - EXECUTE BLOCK AS BEGIN DECLARE c CURSOR FOR SELECT 1; OPEN c; FETCH c INTO x; CLOSE c; END
  - EXECUTE BLOCK AS BEGIN IF (1=1) THEN LEAVE; WHILE (1=0) DO EXIT; CONTINUE; CASE x WHEN 1 THEN SUSPEND; END
  - EXECUTE BLOCK AS BEGIN EXECUTE PROCEDURE p(1,2); CALL f(4,5); EXECUTE STATEMENT 'select 1'; END
  - EXECUTE BLOCK AS BEGIN WHEN SQLCODE < 0 DO POST EVENT 'err'; RAISE my_exc; END
  - "EXECUTE BLOCK AS BEGIN INSERT INTO t(a,b) VALUES(1,2) RETURNING a,b INTO x,y; END"
  - "EXECUTE BLOCK AS BEGIN EXECUTE STATEMENT 'select 1' WITH CALLER PRIVILEGES AS USER 'u' PASSWORD 'p' ROLE 'r' ON EXTERNAL 'db' WITH BIND TIMEOUT 5 INTO x; END"
