id: sql-ddl-udr
title: External UDR
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE FUNCTION name (...) RETURNS type EXTERNAL NAME 'pkg.fn' ENGINE UDR
    DECLARE EXTERNAL FUNCTION name ... ENTRY_POINT 'ep' MODULE_NAME 'lib'
    DECLARE FILTER name INPUT_TYPE n OUTPUT_TYPE n ENTRY_POINT 'ep' MODULE_NAME 'lib'
    CREATE FILTER name INPUT_TYPE n OUTPUT_TYPE n ENTRY_POINT 'ep' MODULE_NAME 'lib'
    DROP FILTER name
  acceptance:
    - "CREATE FUNCTION f(x int) RETURNS INT EXTERNAL NAME 'pkg.f' ENGINE UDR"
    - "DECLARE EXTERNAL FUNCTION f ENTRY_POINT 'ep' MODULE_NAME 'mod'"
    - "DECLARE FILTER flt INPUT_TYPE 1 OUTPUT_TYPE 2 ENTRY_POINT 'ep' MODULE_NAME 'mod'"
    - "DROP FILTER flt"
