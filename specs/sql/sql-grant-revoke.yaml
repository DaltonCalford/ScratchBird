id: sql-grant-revoke
title: GRANT / REVOKE
status: draft
version: 0.2.0
updated: 2025-08-15T00:00:00Z
content:
  matrix:
    table_view: [SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRIGGER, ALTER, VISIBILITY]
    procedure_function: [EXECUTE, ALTER, VISIBILITY]
    sequence: [USAGE, SELECT, UPDATE, ALTER, VISIBILITY]
    package: [EXECUTE, ALTER, VISIBILITY]
    tablespace: [USAGE, CREATE IN, ALTER, VISIBILITY]
    foreign_server: [USAGE, ALTER, VISIBILITY]
    foreign_table: [SELECT, INSERT, UPDATE, DELETE, REFERENCES, ALTER, VISIBILITY]
    publication: [USAGE, MANAGE]
    subscription: [USAGE, MANAGE]
    trace_profile: [MANAGE]
    audit_policy: [MANAGE]
    job: [USAGE, EXECUTE, MANAGE, VISIBILITY]
    schedule: [USAGE, MANAGE, VISIBILITY]
    cluster: [USAGE, MANAGE]
    service: [USAGE, MANAGE, VISIBILITY]
    auth_provider: [MANAGE, VISIBILITY]
    backup_restore: [BACKUP DATABASE, RESTORE DATABASE, BACKUP TABLESPACE]
    database_link: [USAGE, MANAGE, VISIBILITY]
  acceptance:
    - "GRANT SELECT, UPDATE ON TABLE t TO user1"
    - "GRANT EXECUTE ON PROCEDURE p TO PUBLIC WITH GRANT OPTION"
    - "REVOKE GRANT OPTION FOR SELECT ON TABLE t FROM user1"
    - "GRANT USAGE ON SEQUENCE s TO role_r"
    - "GRANT EXECUTE ON PACKAGE pkg TO user2"
    - "GRANT USAGE ON FOREIGN SERVER srv TO role_r"
    - "GRANT CREATE IN ON TABLESPACE fast TO user1"
    - "GRANT MANAGE ON TRACE PROFILE slowlog TO admin_r"
    - "GRANT USAGE ON PUBLICATION pub_all TO repl_r"
    - "GRANT EXECUTE ON JOB hourly_etl TO etl_r"
  diagnostics:
    - "Unknown or invalid privilege '<p>' for object type '<ot>' '<name>'"
    - "REVOKE GRANT OPTION FOR ... recognized"
