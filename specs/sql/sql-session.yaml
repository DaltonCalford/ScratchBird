id: sql-session
name: Session and Transaction statements
notes:
  - Supports CREATE/ALTER/DROP DATABASE, CONNECT/DISCONNECT
  - SET NAMES/ROLE/DIALECT/TRANSACTION/LOCK TIMEOUT/WAIT/NO WAIT/STATISTICS/PLAN/TIMING
  - Now supports: SET TIME ZONE, SET BIND, SET OPTIMIZE, SET SEARCH PATH, SET DEBUG OPTION, SET DECFLOAT ROUND/TRAPS, SESSION RESET
accept:
  - SET TIME ZONE 'UTC'
  - SET BIND mybind
  - SET OPTIMIZE foo=bar
  - SET SEARCH PATH schema1, schema2
  - SET DEBUG OPTION TRACE
  - SET DECFLOAT ROUND CEILING
  - SET DECFLOAT TRAPS INVALID, DIVBYZERO
  - SESSION RESET
  - LOCK TABLE t IN ROW SHARE MODE
