id: sql-ddl-role-user
title: ROLE and USER
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE ROLE name | ALTER ROLE name ... | DROP ROLE name
    CREATE USER name ... | ALTER USER name ... | DROP USER name
  acceptance:
    - 'CREATE ROLE r'
    - 'CREATE USER u'
    - "CREATE USER alice PASSWORD 'pw' FIRSTNAME 'A' LASTNAME 'L' ACTIVE"
    - "ALTER USER bob PASSWORD 'x' INACTIVE"
    - "ALTER ROLE r INACTIVE"
