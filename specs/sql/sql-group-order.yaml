id: sql-group-order
title: GROUP BY / HAVING / ORDER BY / LIMIT/OFFSET
status: draft
version: 0.2.0
updated: 2025-08-12T00:00:00Z
related: [sql-select]
content:
  grammar: |
    GROUP BY expr_list
    HAVING condition
    ORDER BY ( expr | ordinal ) [ASC|DESC] [NULLS FIRST|LAST] [, ...]
    FETCH { FIRST | NEXT } n ROWS ONLY
    SKIP n FIRST m
    ROWS m [TO n]
  notes: |
    Ordinals are 1-based and must be within the projection count.
  acceptance:
    - 'SELECT a, COUNT(*) FROM t GROUP BY a HAVING COUNT(*) > 1 ORDER BY a DESC'
    - 'SELECT * FROM t ORDER BY a FETCH FIRST 10 ROWS ONLY'
    - 'SELECT a, b FROM t ORDER BY 2 NULLS LAST'
