id: psql-routines
title: Procedures and Functions (PSQL)
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE [OR ALTER|RECREATE] PROCEDURE name [(in_params)] [RETURNS (out_params)] AS BEGIN ... END
    CREATE [OR ALTER|RECREATE] FUNCTION name [(in_params)] RETURNS [TABLE (cols)] type AS BEGIN ... END
    DROP PROCEDURE name | DROP FUNCTION name
  notes: |
    Parameter modes (IN/OUT/INOUT) and attributes (DETERMINISTIC, SQL SECURITY) are accepted and
    captured raw in routine attributes. RETURNS TABLE forms captured raw.
    External engine attributes (`EXTERNAL NAME '...' ENGINE ...`) are routed to UDR parser.
  acceptance:
    - 'CREATE PROCEDURE p (a INT) RETURNS (b INT) AS BEGIN b = a; END'
    - 'CREATE FUNCTION f (x INT) RETURNS TABLE (y INT) DETERMINISTIC SQL SECURITY DEFINER AS BEGIN RETURN x; END'
    - "RECREATE PROCEDURE p AS BEGIN END"
    - "RECREATE FUNCTION f EXTERNAL NAME 'pkg.fn' ENGINE UDR RETURNS INT"
