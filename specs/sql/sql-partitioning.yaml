id: sql-partitioning
title: Table partitioning (RANGE/LIST/HASH)
status: should
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Parser-only surfaces to define partitioned tables and manage partitions.
    Implementation deferred. Semantics inspired by PostgreSQL/Oracle.

  grammar: |
    CREATE TABLE t (...) PARTITION BY {RANGE (expr) | LIST (expr) | HASH (expr)}
    CREATE TABLE t PARTITION OF parent FOR VALUES IN (val1, val2)
    CREATE TABLE t PARTITION OF parent FOR VALUES FROM (a) TO (b)
    ALTER TABLE parent ATTACH PARTITION t FOR VALUES ...
    ALTER TABLE parent DETACH PARTITION t
    ALTER TABLE parent ADD PARTITION ... | DROP PARTITION ...

  acceptance:
    - "CREATE TABLE sales (id INT, d DATE) PARTITION BY RANGE (d)"
    - "CREATE TABLE sales_2025 PARTITION OF sales FOR VALUES FROM ('2025-01-01') TO ('2026-01-01')"

  future_engine_tasks:
    - Partition pruning/pushdown, metadata, and constraints.
    - Global/local indexes; partition maintenance operations.
