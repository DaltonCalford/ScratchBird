id: sql-identifiers
title: Identifiers
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [sql-tokens]
content:
  grammar: |
    identifier := unquoted_identifier | quoted_identifier
    unquoted_identifier := [A-Za-z_][A-Za-z0-9_$]* (ASCII; resolver applies Unicode casefold)
    quoted_identifier := "..." (double-quoted, preserves case and content)
  acceptance:
    - 'SELECT a FROM t'
    - 'SELECT "AbC" FROM "MyTable"'
