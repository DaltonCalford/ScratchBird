id: sql-ddl-routine
title: Routine Attributes (IMMUTABLE/STABLE/VOLATILE, LEAKPROOF, SECURITY)
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  grammar: |
    CREATE [OR ALTER|RECREATE] {FUNCTION|PROCEDURE} name (args)
      RETURNS type
      [IMMUTABLE|STABLE|VOLATILE]
      [LEAKPROOF]
      [SECURITY {DEFINER|INVOKER}]
      AS body
    ALTER {FUNCTION|PROCEDURE} name SET [IMMUTABLE|STABLE|VOLATILE]
    ALTER {FUNCTION|PROCEDURE} name SET [LEAKPROOF|NOT LEAKPROOF]
    ALTER {FUNCTION|PROCEDURE} name SECURITY {DEFINER|INVOKER}
  acceptance:
    - 'CREATE FUNCTION f(a int) RETURNS int IMMUTABLE LEAKPROOF SECURITY DEFINER AS begin return a; end'
