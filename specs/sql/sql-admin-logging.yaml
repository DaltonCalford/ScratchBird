id: sql-admin-logging
title: Tracing, logging and auditing (admin SQL)
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Declarative SQL to configure tracing/logging sessions and auditing policies.
    Parser-only for now. Execution is deferred to an admin/trace subsystem.

  grammar: |
    CREATE TRACE PROFILE name OPTIONS (key=value [, ...])
    ALTER TRACE PROFILE name OPTIONS (key=value [, ...])
    DROP TRACE PROFILE name
    START TRACE name
    STOP TRACE name

    CREATE AUDIT POLICY name ACTIONS (action_list) TARGETS (target_list)
      [WHERE condition] OPTIONS (key=value [, ...])
    ALTER AUDIT POLICY name SET (key=value [, ...])
    DROP AUDIT POLICY name
    AUDIT action BY principal [ON object]
    NOAUDIT action BY principal [ON object]

  acceptance:
    - "CREATE TRACE PROFILE slowlog OPTIONS (min_duration_ms=100, sample=0.1)"
    - "START TRACE slowlog"
    - "CREATE AUDIT POLICY auth_fail ACTIONS (LOGIN_FAILURE) TARGETS (ALL)"
    - "AUDIT SELECT BY USER alice ON TABLE public.t1"

  diagnostics:
    - "Unknown trace/audit option '<k>'"
    - "AUDIT requires ACTIONS or policy reference"
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, stable wording

  notes:
    - Parser-only: no runtime behavior yet; maps to a future admin subsystem.
    - Keep OPTIONS generic (key=value) to avoid frequent grammar churn.

  future_engine_tasks:
    - Implement trace session lifecycle and log sinks (file/syslog/etl).
    - Implement audit decision engine; integrate with permission checks.
    - Expose views for active traces and audit history.
