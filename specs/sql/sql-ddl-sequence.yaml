id: sql-ddl-sequence
title: SEQUENCE/GENERATOR
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    CREATE SEQUENCE name [START WITH n] [INCREMENT BY n] [CYCLE] | CREATE GENERATOR name
    ALTER SEQUENCE name RESTART WITH n [INCREMENT BY n] [CYCLE]
    SET GENERATOR name TO n
    DROP SEQUENCE name
  acceptance:
    - 'CREATE SEQUENCE s START WITH 1 INCREMENT BY 1'
    - 'ALTER SEQUENCE s RESTART WITH 100 INCREMENT BY 5 CYCLE'
    - 'SET GENERATOR s TO 42'
