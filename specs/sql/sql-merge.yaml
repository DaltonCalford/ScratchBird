id: sql-merge
title: MERGE
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
content:
  grammar: |
    MERGE INTO target USING source ON condition
      { WHEN [NOT] MATCHED [AND guard] THEN action }...
    action := UPDATE SET set_list | INSERT (cols) VALUES (values) | DELETE | DO NOTHING
  acceptance:
    - 'MERGE INTO t USING u ON t.id = u.id WHEN MATCHED THEN UPDATE SET a=1'
    - 'MERGE INTO t USING u ON t.id = u.id WHEN NOT MATCHED THEN INSERT (a) VALUES (1)'
    - 'MERGE INTO t USING u ON t.id = u.id WHEN NOT MATCHED THEN DO NOTHING'
