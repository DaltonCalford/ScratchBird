content:
  grammar: |
    UPDATE target
      SET assignment_list
      [FROM from_list]
      [WHERE condition | WHERE CURRENT OF cursor]
      [RETURNING select_list]
  acceptance:
    - 'UPDATE t SET a=1, b=2 WHERE a > 0 RETURNING a'
    - 'UPDATE t SET a=1 FROM u WHERE t.id = u.id RETURNING a'
    - 'UPDATE t SET a=1 WHERE CURRENT OF c1'
