id: sql-funcs-search
title: String functions and predicates
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [sql-expressions]
content:
  items:
    - SUBSTRING(expr FROM start [FOR length])
    - EXTRACT(part FROM expr)
    - column LIKE pattern [ESCAPE c]
    - column SIMILAR TO pattern [ESCAPE c]
    - column CONTAINING substr
    - column STARTING WITH prefix
    - UPPER(expr)
    - LOWER(expr)
  acceptance:
    - "SELECT SUBSTRING(name FROM 1 FOR 3) FROM t"
    - "SELECT EXTRACT(YEAR FROM created_at) FROM t"
    - "SELECT * FROM t WHERE name LIKE 'A%'"
    - "SELECT * FROM t WHERE name SIMILAR TO '[A-Z]%'"
    - "SELECT * FROM t WHERE name CONTAINING 'foo'"
    - "SELECT * FROM t WHERE name STARTING WITH 'bar'"
    - "SELECT UPPER(name), LOWER(name) FROM t"
