id: sql-tablespaces
title: Tablespaces and secondary files
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Parser-only SQL for tablespaces and secondary/data files placement.
    Execution deferred. Options intentionally generic.

  grammar: |
    CREATE TABLESPACE name LOCATION 'path' [OPTIONS (key=value [, ...])]
    ALTER TABLESPACE name ADD FILE 'path' SIZE size_expr [AUTOEXTEND]
    ALTER TABLESPACE name SET (key=value [, ...])
    DROP TABLESPACE name [INCLUDING CONTENTS]

    CREATE TEMP TABLESPACE name LOCATION 'path'

    -- Usage on objects
    CREATE TABLE t (id INT) TABLESPACE name
    CREATE INDEX ix ON t(id) TABLESPACE name

    -- Move data/indexes between tablespaces
    ALTER TABLE schema.table SET TABLESPACE name
    ALTER TABLE schema.table MOVE TO TABLESPACE name  -- synonym
    ALTER INDEX schema.index SET TABLESPACE name
    ALTER INDEX schema.index REBUILD TABLESPACE name  -- synonym

    -- Transport operations (parser-only)
    DETACH TABLESPACE name [KEEP FILES | DROP FILES]
    ATTACH TABLESPACE name FROM 'path' [OPTIONS (key=value [, ...])]

  acceptance:
    - "CREATE TABLESPACE fast LOCATION '/mnt/nvme1'"
    - "ALTER TABLESPACE fast ADD FILE '/mnt/nvme1/ts02' SIZE 100G AUTOEXTEND"
    - "CREATE TABLE t(a INT) TABLESPACE fast"
    - "ALTER TABLE public.t SET TABLESPACE fast"
    - "ALTER INDEX public.ix SET TABLESPACE cold"
    - "DETACH TABLESPACE cold KEEP FILES"
    - "ATTACH TABLESPACE cold FROM '/mnt/cold/ts-cold'"

  diagnostics:
    - "Invalid size expression"
    - "Location path not permitted by policy"
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, stable wording

  notes:
    - Parser-only. Engine must enforce path policies and quotas later.
    - Moving objects may require rewrite/rebuild semantics; we provide synonyms used by other engines.

  future_engine_tasks:
    - Implement filegroup/tablespace mapping, autoextend, quotas.
    - Integrate with storage layer allocation and rebalancing.
    - Online/offline move and rebuild operations; locking and progress reporting.
    - Transportable tablespaces: safety checks, metadata fix-up, and recovery.
