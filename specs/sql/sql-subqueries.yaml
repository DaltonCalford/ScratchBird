id: sql-subqueries
title: Subqueries & Predicates
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related: [sql-select]
content:
  predicates:
    - IN (subquery|expr_list)
    - EXISTS (subquery)
    - ANY/ALL (subquery) with comparison ops
  scalar_subquery: returns single value
  acceptance:
    - 'SELECT * FROM t WHERE a IN (SELECT a FROM u)'
    - 'SELECT * FROM t WHERE EXISTS (SELECT 1 FROM u WHERE u.a=t.a)'
    - 'SELECT * FROM t WHERE t.a > ALL (SELECT a FROM u)'
