id: sql-admin-jobs
title: Job scheduling and agent
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Parser-only SQL to define jobs and schedules, for a future agent.
    Supports CRON, EVERY, and AT forms. Execution deferred.

  grammar: |
    CREATE SCHEDULE name CRON 'expr' [TIME ZONE 'tz']
    CREATE SCHEDULE name EVERY interval [STARTS AT ts] [TIME ZONE 'tz']
    CREATE SCHEDULE name AT ts [TIME ZONE 'tz']
    ALTER SCHEDULE name SET (key=value [, ...])
    DROP SCHEDULE name

    CREATE JOB name ACTION <callable_or_statement>
      SCHEDULE name [ON CLUSTER cl | ON NODE 'node' | ANY]
      OPTIONS (key=value [, ...])
    ALTER JOB name SET (key=value [, ...]) [ENABLE|DISABLE]
    DROP JOB name
    RUN JOB name [ON NODE 'node'] NOW

  acceptance:
    - "CREATE SCHEDULE nightly CRON '0 2 * * *' TIME ZONE 'UTC'"
    - "CREATE JOB backup ACTION EXECUTE PROCEDURE do_backup() SCHEDULE nightly"
    - "RUN JOB backup NOW"

  diagnostics:
    - "Invalid CRON expression"
    - "Unknown schedule 'name'"

  notes:
    - Parser-only for now. Engine agent to be added later.
    - ACTION can be EXECUTE PROCEDURE, EXECUTE STATEMENT, or CALL.

  future_engine_tasks:
    - Implement agent with durable job queue and locking.
    - Distributed scheduling across cluster; node affinity.
    - Job output logging and retry policy.
