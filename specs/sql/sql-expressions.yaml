id: sql-expressions
title: Expressions
status: draft
version: 0.2.0
updated: 2025-08-12T00:00:00Z
related: [sql-operators, sql-literals, sql-functions-like, sql-cast-collate]
content:
  forms:
    - column_ref
    - literal (strings, numbers including leading-dot decimals and exponents; underscores allowed in digits)
    - function_call
    - arithmetic / comparison / boolean predicates
    - CAST(expr AS type_descriptor) and :: type suffix
    - IN (list|subquery), BETWEEN a AND b, [NOT] LIKE pattern [ESCAPE e], SIMILAR TO pattern
    - EXISTS (subquery), quantified comparisons (=|<>|<|<=|>|>= {ANY|ALL} (subquery))
    - COLLATE name
    - CASE WHEN ... THEN ... [ELSE ...] END
  type_descriptor:
    grammar: |
      type_name [ ( length | precision [, scale] ) ] [ CHARACTER SET charset ] [ [] ... ]
  dollar_quoted:
    notes: |
      Dollar-quoted strings use $tag$ ... $tag$ delimiters; tags must match; nesting is not allowed.
  acceptance:
    - 'SELECT a + 1 FROM t'
    - 'SELECT a = b FROM t'
    - 'SELECT CAST(a AS VARCHAR(20)) FROM t'
    - 'SELECT a::DECIMAL(10,2) FROM t'
    - "SELECT a BETWEEN 1 AND 2 FROM t"
    - "SELECT a IN (1,2,3) FROM t"
    - "SELECT s LIKE 'A%' ESCAPE '\\' FROM t"
    - "SELECT s SIMILAR TO '(foo|bar)' FROM t"
    - 'SELECT CASE WHEN a>1 THEN 2 ELSE 3 END FROM t'
    - 'SELECT EXISTS (SELECT 1) FROM r'
    - 'SELECT a = ANY (SELECT 1) FROM r'
    - "SELECT $$hello$$"
