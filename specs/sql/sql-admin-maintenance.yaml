id: sql-admin-maintenance
title: Database maintenance and system tasks
status: proposal
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Parser-only SQL for maintenance: sweep, cache, background tasks.

  grammar: |
    ALTER DATABASE SWEEP {IMMEDIATE | SCHEDULE schedule_name}
    SET SWEEP INTERVAL n
    SET PAGE CACHE n
    SET RESERVE SPACE {ON|OFF}
    SET READ CONSISTENCY {ON|OFF}

    START BACKGROUND TASK task_name [OPTIONS (key=value [, ...])]
    STOP BACKGROUND TASK task_name

  acceptance:
    - "ALTER DATABASE SWEEP IMMEDIATE"
    - "SET PAGE CACHE 1024"
    - "START BACKGROUND TASK stats OPTIONS (interval='5m')"

  diagnostics:
    - "Unknown task '<name>'"

  notes:
    - Parser-only; maps to future GC/stats services.

  future_engine_tasks:
    - Implement coordinated sweep/gc and stats gathering.
    - Expose monitoring views and events.
