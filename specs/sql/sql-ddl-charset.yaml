content:
  grammar: |
    CREATE CHARACTER SET name [COLLATION default_collation] [FROM external]
    ALTER CHARACTER SET name ...
    DROP CHARACTER SET name
  acceptance:
    - 'CREATE CHARACTER SET cs1 COLLATION coll1'
    - "CREATE CHARACTER SET cs2 FROM 'ext'"
