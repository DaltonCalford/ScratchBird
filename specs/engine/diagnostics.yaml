id: engine-diagnostics
name: Diagnostics and Recovery
notes:
  - Parsers emit warnings/errors with optional SourceSpan. Messages are concise and stable.
  - Minimal recovery: skip to next major clause keyword on malformed segments; never crash on End.
  - Message style: short imperative/indicative, no punctuation at end unless needed.
  - All warnings added in DDL/PSQL now use a helper and include a span covering the statement.
examples:
  - case: WINDOW RANGE without ORDER BY
    input: SELECT x FROM t WINDOW w AS (RANGE BETWEEN 1 PRECEDING AND CURRENT ROW)
    warns:
      - WINDOW RANGE frame without ORDER BY
  - case: WINDOW FOLLOWING..PRECEDING
    input: SELECT x FROM t WINDOW w AS (ROWS BETWEEN 1 FOLLOWING AND 1 PRECEDING)
    warns:
      - WINDOW frame FOLLOWING..PRECEDING unusual
  - case: Negative bounds
    input: SELECT x FROM t WINDOW w AS (ROWS BETWEEN -1 PRECEDING AND CURRENT ROW)
    warns:
      - WINDOW frame start negative bound
  - case: INSERT column/value mismatch
    input: INSERT INTO t(a,b) VALUES(1)
    warns:
      - INSERT column count does not match VALUES tuple length
  - case: PSQL FOR SELECT INTO count mismatch
    input: EXECUTE BLOCK AS BEGIN FOR SELECT a,b FROM t INTO x; END
    warns:
      - FOR SELECT INTO variable count mismatch with projection (heuristic)
  - case: PSQL DML RETURNING INTO mismatch
    input: EXECUTE BLOCK AS BEGIN UPDATE t SET a=1 RETURNING a,b INTO x; END
    warns:
      - DML RETURNING INTO variable count mismatch (heuristic)
  - case: DECLARE missing type
    input: EXECUTE BLOCK AS BEGIN DECLARE x ; END
    warns:
      - DECLARE missing type for variable 'x'
  - case: UPDATE empty SET
    input: UPDATE t SET WHERE id=1
    warns:
      - UPDATE has empty SET list
  - case: DELETE USING without identifiers
    input: DELETE FROM t USING WHERE id=1
    warns:
      - DELETE USING has no identifiers
  - case: UPSERT matching mismatch
    input: UPDATE OR INSERT INTO t(a,b) VALUES(1,2) MATCHING(c)
    warns:
      - UPSERT MATCHING column not in INSERT column list
