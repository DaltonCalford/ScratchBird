id: engine-journaling
title: Journaling (Write-After Log), Replication, and PITR
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Defines a commit-time logical journal (write-after log) that records
    committed changes for point-in-time recovery (PITR) and logical replication.
    MGA remains the concurrency model; journaling is orthogonal and optional.

  terminology:
    - LSN: Monotonic log sequence number assigned at commit by a single sequencer
    - Journal Segment: Physical file chunk (e.g., 128MB/1GB) storing records
    - Shipper: Asynchronous worker pushing journal to external sinks

  writer_model:
    sequencer: |
      - Single global sequencer assigns LSNs to commits in order.
      - Commits enqueue their change batch; a writer thread performs group-commit
        to the canonical journal (segmented files) before ACK (sync/quorum modes)
        or after ACK (async mode).
    group_commit: |
      - Configurable flush interval and max-batch; fsync policy per mode.
      - Checksums per record and per segment; optional compression.
    durability_modes:
      - async: commit returns after enqueue; writer persists later
      - sync: commit waits for local segment fsync
      - quorum: commit waits for N sink-acks (including local) before return

  record_format:
    container: Protobuf/FlatBuffers (binary), versioned envelope
    fields:
      - db_uuid
      - timeline/epoch
      - lsn
      - txn_id
      - commit_ts
      - schema_version
      - "changes: list of {kind: INSERT|UPDATE/DELETE/DDL/SEQUENCE, rel, key, before?, after?}"
      - "blob: streamed parts if needed (chunked)"
      - checksum, compression, encryption headers

  sinks:
    - "file: local segmented files with retention/rotation"
    - "remote_db: gRPC/HTTP apply service; transactional batching"
    - "kafka: topic/partition by table+pk; global LSN in headers"
    - "object_storage: s3-compatible upload of closed segments"

  replayer_apply:
    ordering: |
      - Apply by ascending LSN; DDL emits barriers; enforce schema_version.
      - Idempotent keys (db_uuid, txn_id, change_seq) to skip duplicates.
    batching: |
      - Transactional batch per LSN window; FK-sensitive ordering or deferred checks.
    failure_handling: |
      - Resume from last durable LSN checkpoint; exponential backoff on sink errors.

  configuration:
    scope: |
      - Global defaults in server config.
      - Per-database overrides via database config file (co-located) or SQL.
    yaml_example: |
      journaling:
        enabled: true
        mode: quorum            # async | sync | quorum
        quorum_acks: 2          # number of sinks required (>=1)
        writer_threads: 1       # journal writers for canonical file (keep 1)
        group_commit_ms: 3      # flush interval
        max_batch_bytes: 8388608
        segment_size_mb: 1024
        retention:
          min_segments: 4
          min_hours: 72
          archive_to_object_storage: true
        compression: zstd       # none | zstd | lz4
        encryption:
          enabled: true
          cipher: aes-256-gcm
          key_ref: kms:projects/x/keys/y
        spill_on_backpressure: true
        sinks:
          - type: file
            path: /var/lib/scratchbird/journal
          - type: kafka
            brokers: [k1:9092, k2:9092]
            topic: sb_changes
            acks: all
            partitions: 24
          - type: remote_db
            endpoint: https://replica-1.internal:8443/apply
            tls: require
            concurrency: 8
    sql_overrides: |
      ALTER DATABASE SET ( JOURNALING = 'ON', JOURNAL_MODE = 'QUORUM', JOURNAL_GROUP_COMMIT_MS = 5 );
      ALTER DATABASE SET ( JOURNAL_RETENTION_HOURS = 168, JOURNAL_SEGMENT_SIZE_MB = 512 );

  diagnostics:
    - "JOURNAL writer backlog high; enabling backpressure"
    - "JOURNAL sink '<name>' unavailable; retrying"
    - "JOURNAL quorum not met; commit blocked"
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, stable wording

  security:
    - Encrypt journal at rest; rotate keys; redact/mask sensitive columns optionally.
    - TLS for remote sinks; mTLS for DB apply services; access control lists.

  integration_points:
    backup_restore: |
      - Tie closed-segment checkpoints to backup IDs to support restore+apply from LSN.
    replication: |
      - Logical replication uses same journal; downstream subscribers filter by rel/schema.

  future_engine_tasks:
    - Exactly-once delivery semantics for Kafka/object storage
    - Parallel apply planner with FK graph awareness
    - SQL surfaces for sink management (CREATE/ALTER/DROP JOURNAL SINK)
