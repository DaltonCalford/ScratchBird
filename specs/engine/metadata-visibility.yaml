id: engine-metadata-visibility
title: Metadata Visibility Privilege and Catalog Filtering
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Adds a `VISIBILITY` privilege (aka BROWSE/LIST) to control whether an object
    appears in catalog/information views and `SHOW`/extraction, independent of
    data-operation privileges (SELECT/INSERT/UPDATE/DELETE/EXECUTE/etc.).
    Supports configuration modes for backward compatibility.

  privilege:
    objects:
      - schema
      - table
      - view
      - sequence
      - procedure
      - function
      - package
      - index
      - tablespace
      - database link
    semantics: |
      - If a user lacks VISIBILITY on an object, catalog listings and SHOW do not
        include it. Errors avoid confirming existence when user also lacks all
        direct privileges.
      - Name-resolution still succeeds if the user has a direct privilege but not
        VISIBILITY (strict mode may require explicit VISIBILITY; see modes).

  modes:
    metadata_visibility_mode:
      - permissive   # default: any direct privilege implies visibility unless explicitly revoked
      - strict       # visibility must be explicitly granted; direct privileges do not imply it
      - public       # legacy behavior; objects are discoverable unless explicitly hidden

  catalog_filtering:
    rules: |
      - Information-schema/system views filter rows with `has_visibility_or_privilege(obj)`
        according to the configured mode.
      - `isql` SHOW/extraction uses the same filtering routine.
      - Errors should be phrased to avoid leaking presence when neither VISIBILITY
        nor direct privilege is held (e.g., "object not found").

  grant_matrix_updates:
    - Add VISIBILITY to relevant object kinds in sql-grant-revoke.yaml

  configuration:
    yaml_example: |
      metadata:
        visibility_mode: permissive   # permissive | strict | public

  diagnostics:
    - "VISIBILITY denied for object '<name>'"
    - "Object not found"  # used when neither visibility nor privilege is present
  diagnostics_notes:
    - Messages follow engine-diagnostics style; concise, stable wording

  future_engine_tasks:
    - Implement has_visibility_or_privilege() predicate in catalog provider
    - Update isql extraction and SHOW to use filtering
    - Add audit hooks for visibility rule hits/misses
