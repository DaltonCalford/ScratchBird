id: engine-config
name: Engine configuration
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Engine configuration is read at process startup via the SB_CONFIG environment
    variable pointing to a simple key=value file. Absent keys use defaults.
  keys:
    - key: allowed_page_sizes
      type: list<int>
      desc: Comma-separated page sizes in bytes that the engine will accept when opening databases.
      default: [4096, 8192, 16384, 32768, 65536, 131072]
    - key: default_page_size
      type: int
      desc: Page size used when creating a database unless overridden by create options.
      default: 4096
    - key: prealloc_mb
      type: int
      desc: Preallocate this many MiB per segment file on creation. 0 to disable.
      default: 0
    - key: direct_io
      type: bool
      desc: Use O_DIRECT when opening segment files (where supported).
      default: false
    - key: checksum_policy
      type: enum(off|crc32c|verify_on_read)
      desc: Select header/data page checksum policy.
      default: crc32c
    - key: fsync_policy
      type: enum(always|group|os-default)
      desc: Select fsync strategy. Group delays fsync to group dirty pages; os-default defers to OS buffering.
      default: always
  examples:
    - |
      allowed_page_sizes=4096,8192,16384,32768,65536,131072
      default_page_size=8192
      prealloc_mb=1024
      direct_io=on
      checksum_policy=crc32c
      fsync_policy=group
  diagnostics:
    - "Unknown config key '<k>' ignored"
    - "Invalid value for '<k>' – using default"
