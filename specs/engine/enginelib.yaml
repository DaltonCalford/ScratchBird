id: enginelib
title: EngineLib Database Engine Architecture
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    This document analyzes Firebird's storage/engine internals and proposes
    a parser-aligned EngineLib architecture for ScratchBird. It focuses on
    on-disk structure (ODS), page cache, transactions/MVCC, indexing,
    catalogs/bootstrap, locking, backup/restore, tablespaces, and admin surfaces.

  references_firebird:
    - file: jrd/ods.h
      note: Page and ODS constants; page type structures
    - file: jrd/pag.h
      note: Page manager and page space accounting
    - file: jrd/pag.cpp
      note: Header page, clumplets, ODS checks, page allocation
    - file: jrd/cch.cpp
      note: Disk cache manager (buffer cache, latching)
    - file: jrd/dpm.epp
      note: Data page manager (pointer pages, data pages)
    - file: jrd/btr.cpp
      note: B-tree operations (navigation/split/garbage)
    - file: jrd/idx.cpp
      note: Index DDL and maintenance
    - file: jrd/tra.cpp
      note: Transaction management; snapshot; sweep interactions
    - file: jrd/vio.cpp
      note: Record versioning (back versions), visibility rules
    - file: jrd/ods.cpp
      note: PIP/TIP capacity and calculations
    - file: jrd/jrd.cpp
      note: JProvider::createDatabase path and DPB processing
    - file: jrd/os/pio.h
      note: Physical I/O interfaces (platform-specific in os/*)
    - file: jrd/nbak.cpp
      note: NBackup/backup locking and state

  strengths_firebird:
    - Single-file database with simple deployment; embedded-friendly
    - MVCC via record back versions; cooperative cleanup (sweep)
    - Page-oriented design (PIP/TIP) yields predictable I/O patterns
    - Mature B-tree implementation and metadata catalog
    - Flexible attachment model (Y-valve)

  weaknesses_firebird:
    - No universal WAL; recovery relies on page state and backups
    - MVCC cleanup (sweep) can lag; old version chains and index garbage
    - ODS compatibility evolution constrains schema of page formats
    - Limited native tablespace/filegroup semantics
    - Lock manager complexity in classic/CS modes

  design_principles:
    - Engine as a library (EngineLib) with a stable C API; embeddable
    - Strict layering: Storage (Pager/Cache), MVCC/Txn, Catalog, DDL/DML exec
    - Deterministic on-disk structures with checksums and versioning
    - Concurrency via MVCC snapshots; background vacuum optional
    - Pluggable index methods (btree baseline; hooks for GIN/RTREE/BITMAP)
    - Tablespaces as first-class page spaces (multiple files per space)
    - Clear separation of parser surfaces vs deferred engine features

  components:
    storage_layer:
      pager: |
        - Responsible for page I/O, allocation, and checksums.
        - Supports multiple page spaces (DB, TEMP, per-tablespace).
      buffer_cache: |
        - Clock/ARC-like eviction; latch hierarchy; per-page hash.
        - Dirty page write-back policy; group commit integration.
      file_manager: |
        - Platform abstraction for files; direct I/O options; async prefetch.
    catalog_layer:
      bootstrap: |
        - Header page seeds ODS and root pointers to system relations.
        - System schema per specs/system-schema.md; UUID object IDs.
      metadata: |
        - System tables track relations, fields, indexes, privileges.
    transaction_layer:
      mvcc: |
        - Snapshot isolation with transaction IDs; visibility rules.
        - Record back-version chains; garbage flags; HOT pruning.
      tip: |
        - Transaction Inventory Pages to map txn states; cached in memory.
      sweep_vacuum: |
        - Background vacuum (optional) to unlink obsolete back versions and index garbage.
    indexing:
      btree: |
        - Fixed-size nodes per page; split/merge; prefix compression.
      extensions: |
        - Provider hooks for GIN/RTREE/BITMAP; planner can select by method.
    tablespaces:
      layout: |
        - Named page spaces with one or more files; extent tracking per space.
      moves: |
        - ALTER TABLE/INDEX SET|MOVE TABLESPACE triggers copy/rebuild.
    backup_recovery:
      model: |
        - Baseline full backup/restore; optional incremental (page-change map).
        - WAL/journal optional (append-only segments) for fast recovery.
    locking:
      model: |
        - Lightweight latches for pages; logical locks for DDL; global LM optional.
    security:
      encryption: |
        - Pluggable at page level; header clumplet records cipher and KDF params.

  ods_layout:
    page_size: [4096, 8192, 16384, 32768]
    page_header: [checksum, page_no, space_id, type, flags, scn, prev, next]
    page_types:
      - header
      - pointer_page (PIP)
      - transaction_inventory (TIP)
      - data
      - index
      - blob
      - generator
      - scn_map
      - space_catalog
    header_page:
      fields: [ods_version, minor, page_size, flags, sys_root_pp, next_page, clumplets]
      clumplets: [encryption_info, sweep_interval, page_cache, reserve_space]

  implementation_phases:
    - Phase A: Minimal ODS, Pager, Cache, CREATE DATABASE bootstrap
    - Phase B: Catalog DDL (CREATE TABLE/INDEX), heap storage, simple scans
    - Phase C: MVCC snapshots, INSERT/UPDATE/DELETE with record versions
    - Phase D: B-tree indexes, index maintenance, simple optimizer hooks
    - Phase E: Tablespaces (create/use/move), backup/restore (full)
    - Phase F: Vacuum/sweep, incremental backup or WAL option
    - Phase G: Advanced index methods hooks; admin surfaces wiring
    - Phase H: Provider SPI integration (FDW read-only stage)

  future_engine_tasks:
    - WAL journaling vs nbackup-style incremental; choose one or support both
    - Online DDL locking model; metadata versioning
    - Row-level security enforcement and matview refresh mechanics
    - Cluster/service routing; shared auth integration
