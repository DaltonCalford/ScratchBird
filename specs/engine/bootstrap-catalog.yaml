id: engine-bootstrap-catalog
name: Catalog Bootstrap Plan
status: draft
version: 0.1.0
updated: 2025-08-15T00:00:00Z
content:
  overview: |
    Defines the order and content to build the initial system catalog. Uses
    UUID v7 for all object OIDs. Seeds core schemas and roles. Applies DDL for
    SDB$ tables and compatibility views. Records catalog version.
  steps:
    - step: Create core SDB$ tables
      details: Create SDB$OBJECT, SDB$SCHEMA, SDB$DOMAIN, SDB$RELATION, SDB$COLUMN, SDB$INDEX, SDB$CONSTRAINT, SDB$ROUTINE, SDB$PACKAGE, SDB$SEQUENCE, SDB$TRIGGER, SDB$EXCEPTION, SDB$CHARSET, SDB$COLLATION, SDB$USER, SDB$ROLE, SDB$GRANT, SDB$DEPENDENCY, SDB$SOURCE, SDB$STATS
    - step: Create catalog version tables
      details: |
        Create SDB$CATALOG_VERSION(major, minor, stamp TIMESTAMPTZ)
        Create SDB$MIGRATIONS(id TEXT PRIMARY KEY, applied_at TIMESTAMPTZ, text_hash CHAR(40))
    - step: Seed schemas
      details: |
        Seed using fixed UUIDs for:
          - sys.catalog
          - sys.security
          - sys.monitoring
          - public
    - step: Seed users/roles
      details: |
        Seed SYSDBA user and PUBLIC role with well-known UUIDs;
        grant ownership of system schemas to SYSDBA
    - step: Seed character sets and collations
      details: Insert UTF8 charset and a deterministic default collation
    - step: Create compatibility views
      details: Create RDB$* and MON$* views as per sdb-compat-views/mappings
    - step: Record version
      details: Insert current catalog version and baseline migration id
  decisions:
    - UUID: version 7, sortable; stored as 16-byte BINARY; textual form canonical when needed
    - Identifier folding: ASCII-only for system; engine may enable ICU later; system tables use UTF8 deterministic collation
    - Tablespace: system catalog resides in default system tablespace
    - Privileges: direct writes to SDB$ restricted to DDL engine; RDB$ views read-only
    - Visibility: enforce VISIBILITY privilege in views for non-owners
