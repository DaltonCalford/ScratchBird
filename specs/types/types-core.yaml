id: types-core
title: Core Data Types
status: draft
version: 0.1.0
updated: 2025-08-12T00:00:00Z
related:
  - engine-api
  - catalog-objects
content:
  families:
    numeric:
      signed:
        - "TINYINT"
        - "SMALLINT"
        - "INTEGER"
        - "BIGINT"
        - "INT128"
      unsigned:
        - "UTINYINT"
        - "USMALLINT"
        - "UINTEGER"
        - "UBIGINT"
        - "UINT128"
      exact:
        - "NUMERIC(p,s)"
        - "DECIMAL(p,s)"
      approx:
        - "FLOAT(p)"
        - "DOUBLE PRECISION"
      decfloat:
        - "DECFLOAT(16)"
        - "DECFLOAT(34)"
    text:
      basic:
        - "CHAR(n)"
        - "VARCHAR(n)"
      case_insensitive:
        - "CITEXT"
      attrs:
        - "CHARACTER SET"
        - "COLLATE"
    temporal:
      date_time:
        - "DATE"
        - "TIME(0..6)"
        - "TIMESTAMP(0..6)"
      tz:
        - "TIME WITH TIME ZONE"
        - "TIMESTAMP WITH TIME ZONE"
    other:
      boolean:
        - "BOOLEAN"
      uuid:
        - "UUID"
      blob:
        - "BLOB {SUB_TYPE, SEGMENT SIZE, CHARACTER SET}"
      json:
        - "JSON"
  limits:
    numeric_precision:
      int128: 38 # recommended max decimal precision mapped to 128-bit scaled
      decimal_max: 38
    varchar_max_bytes: 131072
  wire_encoding:
    varlen: length_u32 + bytes
    fixed:
      int: two_complement
      float: ieee754
      uuid: 16_bytes
  on_disk:
    varlen: length_prefix
    text: utf8_bytes
  casting:
    implicit:
      - rule: signed→wider_signed
      - rule: unsigned→wider_unsigned
      - rule: exact→approx
    explicit:
      - rule: text↔numeric
      - rule: json↔text
  acceptance:
    - parse:
        - "NUMERIC(10,2)"
        - "VARCHAR(255)"
        - "DOUBLE PRECISION"
        - "TIMESTAMP"
    - format: to_string roundtrips core types
