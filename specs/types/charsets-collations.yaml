id: types-charsets-collations
name: Character Sets and Collations
notes:
  - Lexer recognizes national/charset-prefixed strings: N'…' and _CHARSET '…'; charset tag is attached to token
  - Future: map charset tags to ICU/utf8proc identifiers; warn on unknown charsets (lexer emits lightweight warnings)
  - Type modifiers accepted broadly: CHARACTER SET and COLLATE can follow type names in CAST/DECLARE and DDL
accept:
  - _UTF8 'hello'
  - N'Olá'
  - CAST(x AS CHAR(10) CHARACTER SET UTF8 COLLATE UNICODE_CI)
  - CAST(x AS INT128)
  - CAST(x AS UINT128)
  - CAST(x AS DECFLOAT(16))
