# ScratchBird Configuration File
# This file contains configuration settings for the ScratchBird database

# Memory Configuration
[memory]
# Buffer pool size in pages (default: 128)
buffer_pool_size = 128

# Long Transaction Monitoring Configuration
[long_transactions]
# Enable long transaction monitoring (default: true)
enabled = true

# Warning threshold in seconds (default: 600 = 10 minutes)
# Transactions running longer than this will generate warnings
warning_threshold = 600

# Critical threshold in seconds (default: 3600 = 1 hour)
# Transactions running longer than this will trigger the configured policy action
critical_threshold = 3600

# Check interval in seconds (default: 60)
# How often the monitor checks for long transactions
check_interval = 60

# Policy for handling long transactions (default: LOG)
# Options:
#   LOG                  - Just log warnings
#   ROLLBACK_READONLY    - Rollback read-only long transactions
#   ROLLBACK_ALL         - Rollback any long transaction
#   TERMINATE_CONNECTION - Force disconnect long transactions
policy = LOG

# Sweep Configuration
[sweep]
# Enable automatic background sweep (default: true)
auto_sweep_enabled = true

# Sweep interval in seconds (default: 300 = 5 minutes)
auto_sweep_interval = 300

# Gap threshold to trigger sweep (default: 1000000)
# Sweep will run when (OAT - OIT) exceeds this threshold
gap_threshold = 1000000

# Garbage Collection Configuration
[garbage_collection]
# Cooperative GC rate (tuples per page visit, default: 100)
cooperative_rate = 100

# Background GC interval in milliseconds (default: 5000 = 5 seconds)
background_interval_ms = 5000

# Adaptive tuning enabled (default: true)
adaptive_tuning = true

# Logging Configuration
[logging]
# Log level: DEBUG, INFO, WARNING, ERROR (default: INFO)
level = INFO

# Log to file (default: false)
log_to_file = false

# Log file path (default: scratchbird.log)
log_file = scratchbird.log
