[server]
mode = single-database
database = /tmp/sb_conformance_tls.sbdb
auto_create = true
pid_file = /tmp/scratchbird/sb_server_tls.pid

[network]
bind_address = 0.0.0.0
control_socket_dir = /tmp/scratchbird
native_port = 5440
native_pool_min = 1
native_pool_max = 1
native_health_check_interval_ms = 0
pg_port = 0
mysql_port = 0
fb_port = 0

tls_mode = require
tls_cert_file = /tmp/sb_tls/server.crt
tls_key_file = /tmp/sb_tls/server.key
tls_ca_file = /tmp/sb_tls/ca.crt
