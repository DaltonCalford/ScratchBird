<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   width="588"
   height="594"
   viewBox="0 0 588 594"
   version="1.1">
  <defs>
    <!-- Gradient for the bird body/feathers -->
    <linearGradient id="redFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D00105;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B70008;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#780A05;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the head/breast -->
    <radialGradient id="orangeHeadGrad" cx="60%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#F57E01;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#F68701;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D96802;stop-opacity:1" />
    </radialGradient>
    
    <!-- Dark shadow for depth -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#900108;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#780A05;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle (dark inner) -->
  <circle cx="294" cy="297" r="290" fill="#1a1a1a"/>
  
  <!-- Main feather shape (left/back) - flowing red feathers -->
  <path d="M 100 450 
           C 60 350, 80 200, 180 120
           C 220 90, 280 80, 320 100
           C 300 150, 280 200, 290 250
           C 250 280, 200 320, 180 380
           C 160 420, 130 450, 100 450 Z" 
        fill="url(#redFeatherGrad)"/>
  
  <!-- Second feather layer -->
  <path d="M 140 480
           C 100 400, 120 280, 200 200
           C 240 170, 290 160, 310 180
           C 290 220, 270 260, 275 290
           C 240 320, 200 360, 190 410
           C 180 450, 160 480, 140 480 Z"
        fill="#B70008"/>
  
  <!-- Third feather layer (darker) -->
  <path d="M 180 500
           C 150 440, 170 350, 230 280
           C 260 255, 300 250, 310 270
           C 295 300, 280 330, 280 350
           C 260 380, 230 410, 225 440
           C 220 470, 200 500, 180 500 Z"
        fill="#900108"/>
  
  <!-- Bird head (orange/yellow) - positioned right -->
  <ellipse cx="380" cy="250" rx="130" ry="110" fill="url(#orangeHeadGrad)"/>
  
  <!-- Beak (pointing left) -->
  <path d="M 260 240
           L 200 220
           L 205 250
           L 260 270 Z"
        fill="#D00105"/>
  
  <!-- Eye -->
  <ellipse cx="330" cy="210" rx="25" ry="30" fill="#780A05"/>
  <circle cx="335" cy="205" r="8" fill="white"/>
  
  <!-- Feather detail lines for texture -->
  <path d="M 150 350 Q 200 320 250 340" stroke="#780A05" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 160 300 Q 210 270 260 290" stroke="#780A05" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 180 250 Q 220 230 260 250" stroke="#780A05" stroke-width="3" fill="none" opacity="0.5"/>
  
  <!-- Subtle shadow overlay for depth -->
  <ellipse cx="294" cy="297" rx="290" ry="290" fill="url(#shadowGrad)" opacity="0.3"/>
</svg>
