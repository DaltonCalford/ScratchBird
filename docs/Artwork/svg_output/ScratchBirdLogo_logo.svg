<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="1024"
   height="1024"
   viewBox="0 0 1024 1024"
   version="1.1">
  <defs>
    <!-- Metallic silver gradient for background -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6D7D6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#AFAFAF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#989B94;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7E8C6F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dark red/maroon for bird -->
    <linearGradient id="birdRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B15414;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#9E3000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8C0400;stop-opacity:1" />
    </linearGradient>
    
    <!-- Deep red for outer ring -->
    <radialGradient id="outerRingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" style="stop-color:#9E3000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8C0400;stop-opacity:1" />
    </radialGradient>
    
    <!-- Crack/texture pattern -->
    <filter id="crackEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" />
    </filter>
  </defs>
  
  <!-- Outer circular ring -->
  <circle cx="512" cy="512" r="500" fill="url(#outerRingGrad)"/>
  <circle cx="512" cy="512" r="480" fill="#8C0400"/>
  
  <!-- Inner silver/metallic background with crack segments -->
  <!-- Segment 1: Top -->
  <path d="M 512 50
           A 430 430 0 0 1 850 220
           L 780 280
           A 360 360 0 0 0 512 120
           Z" fill="url(#silverGrad)"/>
  
  <!-- Segment 2: Top-right -->
  <path d="M 850 220
           A 430 430 0 0 1 950 512
           L 870 512
           A 360 360 0 0 0 800 300
           Z" fill="#AFAFAF"/>
  
  <!-- Segment 3: Right -->
  <path d="M 950 512
           A 430 430 0 0 1 850 804
           L 780 744
           A 360 360 0 0 0 870 512
           Z" fill="url(#silverGrad)"/>
  
  <!-- Segment 4: Bottom-right -->
  <path d="M 850 804
           A 430 430 0 0 1 512 974
           L 512 904
           A 360 360 0 0 0 800 780
           Z" fill="#989B94"/>
  
  <!-- Segment 5: Bottom-left -->
  <path d="M 512 974
           A 430 430 0 0 1 174 804
           L 244 744
           A 360 360 0 0 0 512 904
           Z" fill="url(#silverGrad)"/>
  
  <!-- Segment 6: Left -->
  <path d="M 174 804
           A 430 430 0 0 1 74 512
           L 154 512
           A 360 360 0 0 0 224 744
           Z" fill="#AFAFAF"/>
  
  <!-- Segment 7: Top-left -->
  <path d="M 74 512
           A 430 430 0 0 1 174 220
           L 244 280
           A 360 360 0 0 0 154 512
           Z" fill="url(#silverGrad)"/>
  
  <!-- Segment 8: Top (remaining) -->
  <path d="M 174 220
           A 430 430 0 0 1 512 50
           L 512 120
           A 360 360 0 0 0 244 280
           Z" fill="#989B94"/>
  
  <!-- Crack lines between segments -->
  <g stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round">
    <!-- Main crack lines radiating from center -->
    <path d="M 512 512 L 512 50" />
    <path d="M 512 512 L 850 220" />
    <path d="M 512 512 L 950 512" />
    <path d="M 512 512 L 850 804" />
    <path d="M 512 512 L 512 974" />
    <path d="M 512 512 L 174 804" />
    <path d="M 512 512 L 74 512" />
    <path d="M 512 512 L 174 220" />
  </g>
  
  <!-- Bird silhouette (phoenix/eagle style) -->
  <g transform="translate(512, 512) scale(0.7) translate(-512, -512)">
    <!-- Bird body -->
    <path d="M 350 650
             C 320 550, 350 450, 420 380
             C 450 350, 500 340, 550 360
             C 580 380, 600 420, 590 460
             C 570 500, 520 520, 480 540
             C 440 560, 420 600, 430 650
             Z" fill="url(#birdRedGrad)"/>
    
    <!-- Bird neck and head -->
    <path d="M 420 380
             C 400 320, 420 250, 480 200
             C 520 170, 580 180, 620 220
             C 650 250, 660 300, 640 340
             C 620 380, 580 400, 550 360
             C 520 330, 480 340, 460 370
             Z" fill="#9E3000"/>
    
    <!-- Beak -->
    <path d="M 620 220
             L 700 200
             L 690 240
             L 640 250 Z" fill="#B15414"/>
    
    <!-- Eye -->
    <ellipse cx="580" cy="240" rx="15" ry="12" fill="#1a1a1a"/>
    <circle cx="583" cy="238" r="4" fill="white"/>
    
    <!-- Wing/feather detail -->
    <path d="M 360 580 Q 400 520 460 500" stroke="#8C0400" stroke-width="4" fill="none"/>
    <path d="M 370 520 Q 410 470 460 450" stroke="#8C0400" stroke-width="4" fill="none"/>
    <path d="M 390 460 Q 430 420 470 400" stroke="#8C0400" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Black outline around entire badge -->
  <circle cx="512" cy="512" r="500" fill="none" stroke="#1a1a1a" stroke-width="12"/>
  
  <!-- Texture/crack overlay on silver parts -->
  <g opacity="0.3" stroke="#4a4a4a" stroke-width="3" fill="none">
    <path d="M 200 300 L 220 340 L 210 380"/>
    <path d="M 800 280 L 780 320 L 790 360"/>
    <path d="M 300 200 L 340 220 L 380 210"/>
    <path d="M 700 750 L 660 720 L 620 740"/>
  </g>
</svg>
